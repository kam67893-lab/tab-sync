<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tab Sync</title>
<script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.5.0/dist/alphaTab.min.js"></script>
<style>
:root{--bg:#161b22;--panel:#212833;--fg:#eef1f5;--ac:#f2b134;--line:#3a4453}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:6px;height:100dvh;display:flex;flex-direction:column}
#player{display:flex;gap:8px;align-items:center;flex:none;margin:4px 0}
#pp{width:60px;font-size:20px;background:var(--ac);border-color:var(--ac);color:#1a1300;font-weight:700}
#seek{flex:1;min-width:0;accent-color:var(--ac)}
#time{font-size:12px;min-width:84px;text-align:right;color:#aab4c3}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0;flex:none}
button,select,.pick{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.pick input{display:none}
button.go{background:var(--ac);border-color:var(--ac);color:#1a1300;font-weight:700;flex:1}
#status{font-size:12px;color:#aab4c3;flex:none}
#wrap{position:relative;background:#fff;color:#000;border-radius:8px;overflow:auto;flex:1;min-height:0}
#lib{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
#list{max-height:30vh;overflow:auto}
.item{display:flex;gap:6px;margin-top:6px}
.item button:first-child{flex:1;text-align:left}
#hl{position:absolute;display:none;background:rgba(242,177,52,.28);border:2px solid var(--ac);pointer-events:none}
</style>
</head>
<body>
<main>
  <video id="v" playsinline style="display:none"></video>
  <div id="player">
    <button id="pp" aria-label="Play or pause">&#9654;</button>
    <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
    <span id="time">0:00 / 0:00</span>
  </div>
  <div class="row">
    <label class="pick">Load tab<input id="gp" type="file"></label>
    <label class="pick">Load video<input id="vf" type="file" accept="video/*,audio/*"></label>
    <select id="trk" aria-label="Track"></select>
    <select id="spd" aria-label="Speed">
      <option value="0.5">0.5x</option><option value="0.75">0.75x</option>
      <option value="1" selected>1x</option>
    </select>
  </div>
  <div class="row">
    <button id="mark" class="go">Mark bar start</button>
    <button id="undo">Undo</button>
    <button id="clear">Clear sync</button>
  </div>
  <div class="row">
    <button id="savesong">Save to library</button>
    <details id="lib"><summary>Library (<span id="cnt">0</span>)</summary><div id="list"></div></details>
  </div>
  <div id="status">Load a tab file and a video to begin.</div>
  <div id="wrap"><div id="at"></div><div id="hl"></div></div>
</main>
<script>
const $ = id => document.getElementById(id);
const video = $('v');
let score = null, marks = [], lastBar = -2;
let tabBytes = null, mediaFile = null, tabName = '', currentId = null, pendingMarks = [], pendingTrack = null;

const api = new alphaTab.AlphaTabApi($('at'), { core: { useWorkers: false }, display: { scale: 0.8 } });

function status() {
  if (!score) { $('status').textContent = 'Load a tab file and a video to begin.'; return; }
  const total = score.masterBars.length;
  $('status').textContent = marks.length >= total
    ? 'All ' + total + ' bars synced. Press play.'
    : 'Play the video, then tap Mark bar start at the start of bar ' + (marks.length + 1) + ' of ' + total + '.';
  if (currentId == null && tabBytes && mediaFile) $('status').textContent += ' Not saved yet: tap Save to library.';
}
let db;
const dbReady = new Promise((res, rej) => {
  const rq = indexedDB.open('tabsync', 1);
  rq.onupgradeneeded = () => {
    rq.result.createObjectStore('songs', { keyPath: 'id', autoIncrement: true });
    rq.result.createObjectStore('files', { keyPath: 'id' });
  };
  rq.onsuccess = () => { db = rq.result; res(); };
  rq.onerror = () => rej(rq.error);
});
const dbop = (names, mode, fn) => new Promise((res, rej) => {
  const t = db.transaction(names, mode);
  const rq = fn(t);
  t.oncomplete = () => res(rq.result);
  t.onerror = t.onabort = () => rej(t.error);
});
async function save() {
  if (currentId == null) return;
  try {
    await dbReady;
    const song = await dbop(['songs'], 'readonly', t => t.objectStore('songs').get(currentId));
    if (!song) return;
    song.marks = marks.slice(); song.track = +$('trk').value; song.updated = Date.now();
    await dbop(['songs'], 'readwrite', t => t.objectStore('songs').put(song));
  } catch (e) {}
}
async function refreshList() {
  await dbReady;
  const songs = await dbop(['songs'], 'readonly', t => t.objectStore('songs').getAll());
  $('cnt').textContent = songs.length;
  $('list').innerHTML = '';
  songs.sort((a, b) => a.name.localeCompare(b.name)).forEach(sg => {
    const row = document.createElement('div'); row.className = 'item';
    const o = document.createElement('button'); o.textContent = sg.name; o.onclick = () => openSong(sg.id);
    const d = document.createElement('button'); d.textContent = '\u2715'; d.setAttribute('aria-label', 'Delete ' + sg.name); d.onclick = () => delSong(sg);
    row.append(o, d); $('list').append(row);
  });
}
async function openSong(id) {
  const song = await dbop(['songs'], 'readonly', t => t.objectStore('songs').get(id));
  const files = await dbop(['files'], 'readonly', t => t.objectStore('files').get(id));
  if (!song || !files) return;
  video.pause();
  currentId = id; tabBytes = files.tab; mediaFile = files.media; tabName = song.name;
  pendingMarks = song.marks || []; pendingTrack = song.track;
  if (video.src) URL.revokeObjectURL(video.src);
  video.src = URL.createObjectURL(mediaFile);
  api.load(tabBytes.slice());
  $('lib').open = false;
}
async function delSong(sg) {
  if (!confirm('Delete "' + sg.name + '" and its sync?')) return;
  await dbop(['songs', 'files'], 'readwrite', t => { t.objectStore('files').delete(sg.id); return t.objectStore('songs').delete(sg.id); });
  if (currentId === sg.id) currentId = null;
  refreshList(); status();
}
$('savesong').onclick = async () => {
  if (!tabBytes || !mediaFile) { $('status').textContent = 'Load a tab and a video first, then save.'; return; }
  const name = (prompt('Song name', tabName) || '').trim();
  if (!name) return;
  try {
    await dbReady;
    currentId = await dbop(['songs', 'files'], 'readwrite', t => {
      const rq = t.objectStore('songs').add({ name, marks: marks.slice(), track: +$('trk').value, updated: Date.now() });
      rq.onsuccess = () => t.objectStore('files').put({ id: rq.result, tab: tabBytes, media: mediaFile });
      return rq;
    });
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    await refreshList(); status();
  } catch (e) { $('status').textContent = 'Could not save: ' + e; }
};

api.scoreLoaded.on(s => {
  score = s;
  $('trk').innerHTML = s.tracks.map((t, i) => '<option value="' + i + '">' + (t.name || 'Track ' + (i + 1)) + '</option>').join('');
  const b = (pendingTrack != null && pendingTrack < s.tracks.length) ? pendingTrack : s.tracks.findIndex(t => /bass/i.test(t.name));
  pendingTrack = null;
  if (b > 0) { $('trk').value = b; api.renderTracks([s.tracks[b]]); }
  marks = pendingMarks; pendingMarks = []; lastBar = -2; status();
});
api.renderFinished.on(() => { lastBar = -2; });

$('gp').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  tabBytes = new Uint8Array(await f.arrayBuffer());
  tabName = f.name.replace(/\.[^.]+$/, '');
  currentId = null; pendingMarks = []; pendingTrack = null;
  api.load(tabBytes.slice());
};
$('vf').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  if (video.src) URL.revokeObjectURL(video.src);
  video.src = URL.createObjectURL(f);
  mediaFile = f; currentId = null; status();
};
$('trk').onchange = e => { if (score) { api.renderTracks([score.tracks[+e.target.value]]); save(); } };
$('spd').onchange = e => { video.playbackRate = +e.target.value; };

$('mark').onclick = () => {
  if (!score || marks.length >= score.masterBars.length) return;
  marks.push(video.currentTime); save(); status();
};
$('undo').onclick = () => { marks.pop(); save(); lastBar = -2; status(); };
$('clear').onclick = () => { marks = []; save(); lastBar = -2; status(); };

function show(i) {
  if (i === lastBar) return;
  lastBar = i;
  const hl = $('hl');
  const lookup = api.renderer.boundsLookup;
  const mb = lookup && i >= 0 ? lookup.findMasterBarByIndex(i) : null;
  if (!mb) { hl.style.display = 'none'; return; }
  const r = mb.realBounds;
  Object.assign(hl.style, { display: 'block', left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
  const wrap = $('wrap');
  wrap.scrollTo({ top: Math.max(0, r.y - wrap.clientHeight / 2 + r.h / 2), behavior: 'smooth' });
}
const fmt = s => { s = Math.max(0, s | 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
let seeking = false;
$('pp').onclick = () => { if (!video.src) return; if (video.paused) video.play(); else video.pause(); };
video.onplay = () => { $('pp').innerHTML = '&#10074;&#10074;'; };
video.onpause = video.onended = () => { $('pp').innerHTML = '&#9654;'; };
$('seek').oninput = () => { seeking = true; if (video.duration) video.currentTime = $('seek').value / 1000 * video.duration; };
$('seek').onchange = () => { seeking = false; };
function updateTime() {
  if (!seeking && video.duration) $('seek').value = video.currentTime / video.duration * 1000;
  $('time').textContent = fmt(video.currentTime) + ' / ' + fmt(video.duration || 0);
}
video.ontimeupdate = updateTime;
video.onloadedmetadata = () => { video.playbackRate = +$('spd').value; updateTime(); };

function tick() {
  const t = video.currentTime;
  let i = -1;
  for (let k = 0; k < marks.length; k++) { if (marks[k] <= t) i = k; else break; }
  show(i);
  requestAnimationFrame(tick);
}
tick();
dbReady.then(refreshList).catch(e => { $('status').textContent = 'Storage unavailable: ' + e; });
</script>
</body>
</html>
